<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Product Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>ShopEase</h1>
    <nav>
      <a href="#">Home</a>
      <a href="#">Products</a>
      <a href="#">Cart</a>
    </nav>
  </header>

  <main class="gallery">

    <article class="card">
      <img src="img_01.jpg" alt="Wireless Headphones" class="card-img">
      <h2 class="card-title">Wireless Headphones</h2>
      <p class="card-price">$59.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

    <article class="card">
      <img src="img_02.jpg" alt="Mechanical Keyboard" class="card-img">
      <h2 class="card-title">Mechanical Keyboard</h2>
      <p class="card-price">$89.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

    <article class="card">
      <img src="img_03.jpg" alt="Smartphone Stand" class="card-img">
      <h2 class="card-title">Smartphone Stand</h2>
      <p class="card-price">$19.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

    <article class="card">
      <img src="img_04.jpg" alt="4K Monitor" class="card-img">
      <h2 class="card-title">4K Monitor</h2>
      <p class="card-price">$299.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

    <article class="card">
      <img src="img_05.jpg" alt="Bluetooth Speaker" class="card-img">
      <h2 class="card-title">Bluetooth Speaker</h2>
      <p class="card-price">$39.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

    <article class="card">
      <img src="img_06.jpg" alt="USB-C Hub" class="card-img">
      <h2 class="card-title">USB-C Hub</h2>
      <p class="card-price">$24.99</p>
      <button class="card-btn">Add to Cart</button>
    </article>

  </main>

  <footer class="footer">
    <p>&copy; 2026 ShopEase. All rights reserved.</p>
  </footer>

</body>
</html>
